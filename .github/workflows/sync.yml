name: Sync routes and guides

# The docs repo vendors routes.json and the guide prose so that its build needs
# no Go toolchain and no checkout of the code.
# The cost of vendoring is drift, so this closes the gap on a schedule rather
# than relying on somebody remembering after they merge a new endpoint.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run sync
      - run: npm run sync:guides

      # A pull request rather than a push: a new endpoint usually needs a
      # sentence of prose that a generator cannot write, and opening a PR is
      # what creates the moment to write it.
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh routes.json and guides from CertPilot'
          branch: sync/upstream
          delete-branch: true
          title: 'Refresh the route table and guides from CertPilot'
          body: |
            `routes.json` has drifted from `core/api/router.go`.

            The endpoint pages are generated, so they will pick this up
            automatically. Check whether any new route needs prose — the
            generator carries the router's comments through, but a route with
            no comment arrives here with no explanation.
