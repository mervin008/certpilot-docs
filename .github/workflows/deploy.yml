name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one midway: a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated reads git history; without this every page claims to
          # have been updated at the moment of the build.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds with ignoreDeadLinks off, so a link to an endpoint that no
      # longer exists fails here rather than shipping.
      - run: npm run build

      - name: Verify every route is documented
        run: npm run check

      # enablement turns Pages on via the API if it is not already on. Without
      # it the first run of this workflow on a fresh repository fails with
      # "Get Pages site failed" — the action looks for a Pages site to
      # configure, finds none, and there is no way to create one from here.
      # Enabling it in the repository settings by hand works equally well, but
      # then the workflow only succeeds on a repository somebody remembered to
      # prepare, which is a poor property for a deploy to have.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
